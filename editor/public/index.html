<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nu_log 編集室</title><link rel="stylesheet" href="/app.css"></head><body>
<header class="app-header"><div class="brand"><span class="brand-icon">n</span><div><strong>nu_log <span>編集室</span></strong><small>B5 · 182 × 257 mm</small></div></div><div class="save-info"><span id="dirty-dot"></span><span id="save-status" role="status">読み込み中</span></div><div class="header-actions"><button id="undo" title="Ctrl+Z">元に戻す</button><button id="redo" title="Ctrl+Shift+Z">やり直す</button><button id="save" class="primary">保存</button><select id="pdf-scope" aria-label="PDFの表紙設定"><option value="all">表紙・裏表紙あり</option><option value="no-covers">表紙・裏表紙なし</option></select><button id="export">PDFを書き出す</button></div></header>
<div id="draft-banner" hidden>前回の未保存の編集があります。<button id="restore-draft">復元する</button><button id="discard-draft">破棄する</button></div>
<div class="workspace"><aside class="sidebar"><div class="sidebar-label">記事一覧 <span id="article-count"></span></div><input id="search" type="search" placeholder="記事・著者を検索" aria-label="記事・著者を検索"><nav id="articles"></nav><button id="add-chapter">＋ 章を追加</button><button id="delete-chapter">選択中の章を削除</button><button id="covers">表紙・裏表紙</button><div class="sidebar-foot">団体カラー <i></i> #014AAD<br>編集はこのパソコンに保存されます</div></aside>
<main class="editor"><div class="editor-bar"><span id="article-meta"></span><span id="block-count"></span></div><div id="article-editor"></div><div class="insert-bar"><span>選択した項目の後に追加</span><button data-add="paragraph">＋ 本文</button><button data-add="heading">＋ 見出し</button><button data-add="figure">＋ 写真</button><button data-add="code">＋ コード</button></div></main>
<section class="preview"><div class="preview-bar"><div class="segmented"><button id="view-article" class="active">この記事</button><button id="view-book">全冊</button></div><button id="refresh-preview">プレビュー更新</button><label class="auto"><input type="checkbox" id="auto-preview" checked>自動更新</label></div><div class="preview-info"><span id="preview-status" role="status">準備中</span><a id="open-preview" target="_blank" rel="noopener">大きく開く ↗</a></div><iframe id="preview-frame" title="Vivliostyle B5 組版プレビュー"></iframe><div class="preview-foot" id="preview-note">記事単独の表示です。通しページ番号と目次は「全冊」で確認できます。</div></section></div>
<dialog id="chapter-dialog"><form id="chapter-form"><div class="dialog-head"><h2>章を追加</h2><button type="button" id="close-chapter">閉じる</button></div><label>章タイトル<input id="chapter-title" required maxlength="300"></label><label>著者<input id="chapter-author" maxlength="200"></label><label>目次の分類<select id="chapter-group"></select></label><label>新しい分類を作る場合<input id="chapter-new-group" maxlength="200" placeholder="空欄なら上の分類に追加"></label><label><input type="checkbox" id="new-chapter-draft">下書き（PDFには含めない）</label><p>同じ分類なら選択中の章の直後、それ以外は分類の末尾に追加します。</p><p id="chapter-error" role="alert"></p><button class="primary" type="submit">追加する</button></form></dialog>
<div id="toast" role="status" hidden></div>
<dialog id="image-dialog"><div class="dialog-head"><h2>写真を選ぶ</h2><button id="close-images" aria-label="閉じる">閉じる</button></div><p>写真をクリックすると選択できます。元画像は変更しません。</p><input id="image-search" type="search" placeholder="記事名・ファイル名で絞り込み" aria-label="写真を検索"><div id="image-library"></div></dialog>
<dialog id="pdf-dialog"><div class="dialog-head"><h2>PDFを書き出す</h2><button id="close-pdf">閉じる</button></div><p id="pdf-status" role="status"></p><a id="pdf-download" class="primary button" href="/output/nu_log.pdf" target="_blank" hidden>PDFを開く</a><details id="pdf-details"><summary>処理の詳細</summary><pre id="pdf-log"></pre></details></dialog>
<script type="module" src="/app.js"></script></body></html>
